[package]
name = "arizona-rust-launcher"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
md5 = "0.7"
fs2 = "0.4"
dirs = "6"
url = "2"
open = "5"
winreg = "0.55"
sha2 = "0.10"
tray-icon = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = { version = "0.18", default-features = false }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
